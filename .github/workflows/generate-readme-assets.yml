name: generate-readme-assets

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout own repo
        uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: Alwin-Saji
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?color_snake=%23FFD166&color_dots=%23161B22,%230e4429,%23006d32,%2326a641,%2339d353&color_dots_border=%230F0F0F
            assets/github-contribution-grid-snake.svg?color_snake=%23FFD166&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - name: ensure assets directory exists
        run: mkdir -p assets

      - name: checkout trophy source
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: master
          path: trophy-src

      - name: setup deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: generate trophy svg
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.TROPHY_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write \
            ./render_svg.ts Alwin-Saji ../assets/trophy.svg onedark

      - name: push generated svgs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}